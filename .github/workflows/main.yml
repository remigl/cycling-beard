name: Sync Drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_resync:
        description: "Resync complet (ignore le cache)"
        type: boolean
        default: false
      resync_only:
        description: "Resync d'une seule étape (bout du nom du dossier, ex. grado). Laisser vide sinon."
        type: string
        default: ""

# Empeche deux runs de ce workflow de tourner en meme temps (evite les courses au push)
concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --include=dev

      - name: Run sync script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          FORCE_RESYNC: ${{ inputs.force_resync && '1' || '0' }}
          RESYNC_ONLY: ${{ inputs.resync_only }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/sync-drive.js

      - name: Commit updated data
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@cycling-beard.com"

          # Uniquement les fichiers produits par le sync (jamais node_modules, etc.)
          git add -A public/

          # Rien a commit ? on s'arrete proprement.
          if git diff --staged --quiet; then
            echo "Rien a commit"
            exit 0
          fi

          # IMPORTANT : le format de date doit etre entre guillemets, sinon
          # "date" recoit deux arguments ("extra operand") et le message est faux.
          git commit -m "sync: $(date '+%Y-%m-%d %H:%M')"

          # Pousse avec jusqu'a 5 tentatives. En cas de conflit pendant le rebase
          # (typiquement public/data/sync-cache.json modifie des deux cotes), on
          # donne la priorite aux donnees fraichement generees par ce sync
          # ("-X theirs" = notre commit pendant un rebase) : le sync reflete
          # toujours l'etat reel de Drive, donc il doit gagner sur ces fichiers.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Push OK (tentative $i)"
              exit 0
            fi
            echo "Echec tentative $i, on nettoie et on reessaie..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Impossible de pousser apres 5 tentatives"
          exit 1
