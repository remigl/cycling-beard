name: Sync Drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_resync:
        description: "Resync complet (ignore le cache)"
        type: boolean
        default: false

# Empeche deux runs de ce workflow de tourner en meme temps (evite les courses au push)
concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --include=dev

      - name: Run sync script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          FORCE_RESYNC: ${{ inputs.force_resync && '1' || '0' }}
        run: node scripts/sync-drive.js

      - name: Commit updated data
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@cycling-beard.com"

          # Ajoute TOUT ce que le sync a produit/modifie (evite les "unstaged changes"
          # qui bloquent le rebase). Inclut sync-cache.json, data, media, gpx, etc.
          git add -A

          # Rien a commit ? on s'arrete proprement.
          if git diff --staged --quiet; then
            echo "Rien a commit"
            exit 0
          fi

          git commit -m "sync: $(date +%Y-%m-%d %H:%M)"

          # Recupere les changements distants AVANT de pousser. Comme tout est
          # commit (working tree propre), le rebase ne sera plus bloque.
          git pull --rebase origin main

          git push
