name: Sync Drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --include=dev

      - name: Run sync script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > service-account.json
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH=./service-account.json node scripts/sync-drive.js
          rm service-account.json

      - name: Commit updated data
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@cycling-beard.com"
          git add public/data/ public/media/ public/gpx/
          git diff --staged --quiet || git commit -m "sync: $(date +%Y-%m-%d)"
          git push
