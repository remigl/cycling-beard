<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO de base ── -->
    <title>The Cycling Beard — Saint-Nazaire → Constanța à vélo (EuroVelo 6)</title>
    <meta name="description" content="Suivez Rémi sur l'EuroVelo 6 : 4 000 km à vélo de Saint-Nazaire (France) à Constanța (Roumanie). Carte en direct, étapes, photos, dénivelés et récits de voyage." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cycling-beard.vercel.app/" />
    <meta name="theme-color" content="#E8620A" />

    <!-- ── Open Graph (partage Facebook, WhatsApp, LinkedIn… et utilisé par Google) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Cycling Beard" />
    <meta property="og:title" content="The Cycling Beard — Saint-Nazaire → Constanța à vélo" />
    <meta property="og:description" content="Expédition à vélo sur l'EuroVelo 6. Carte de suivi en direct, étapes jour par jour, photos et récits." />
    <meta property="og:url" content="https://cycling-beard.vercel.app/" />
    <meta property="og:image" content="https://cycling-beard.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Cycling Beard — Saint-Nazaire → Constanța à vélo" />
    <meta name="twitter:description" content="Expédition EuroVelo 6 en direct : carte, étapes, photos, récits." />
    <meta name="twitter:image" content="https://cycling-beard.vercel.app/og-image.jpg" />

    <!-- ── Données structurées (résultats enrichis Google) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Cycling Beard",
      "alternateName": "Cycling Beard",
      "url": "https://cycling-beard.vercel.app/",
      "description": "Blog de voyage à vélo : Saint-Nazaire → Constanța par l'EuroVelo 6. Carte de suivi en direct, étapes, photos et récits.",
      "inLanguage": ["fr", "en", "es", "it", "de", "nl"],
      "author": {
        "@type": "Person",
        "name": "Rémi",
        "url": "https://cycling-beard.vercel.app/"
      }
    }
    </script>

    <!-- Widget Buy Me a Coffee -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="cyclingBeard"
      data-description="Soutenez Rémi sur son voyage !"
      data-message="Merci de suivre l'aventure ! Un café pour la route ?"
      data-color="#E8620A"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
