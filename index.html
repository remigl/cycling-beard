<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO de base ── -->
    <title>The Moving Beard - Rémi Gladieu</title>
    <meta name="description" content="Blog racontant ma pause. Cela correspond à mon voyage à vélo jusqu'en Croatie et à mon déplacement jusqu'au Japon." />
    <meta name="author" content="Rémi Gladieu" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cycling-beard.vercel.app/" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applique le thème (clair/sombre) AVANT l'affichage : pas de flash au chargement -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tmb_theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- ── Open Graph (partage Facebook, WhatsApp, LinkedIn… et utilisé par Google) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Moving Beard" />
    <meta property="og:title" content="The Moving Beard - Rémi Gladieu" />
    <meta property="og:description" content="Blog racontant ma pause. Cela correspond à mon voyage à vélo jusqu'en Croatie et à mon déplacement jusqu'au Japon." />
    <meta property="og:url" content="https://cycling-beard.vercel.app/" />
    <meta property="og:image" content="https://cycling-beard.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Moving Beard - Rémi Gladieu" />
    <meta name="twitter:description" content="Blog racontant ma pause. Cela correspond à mon voyage à vélo jusqu'en Croatie et à mon déplacement jusqu'au Japon." />
    <meta name="twitter:image" content="https://cycling-beard.vercel.app/og-image.jpg" />

    <!-- ── Données structurées (résultats enrichis Google) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://cycling-beard.vercel.app/#site",
          "name": "The Moving Beard",
          "alternateName": ["Rémi Gladieu", "The Cycling Beard"],
          "url": "https://cycling-beard.vercel.app/",
          "description": "Blog racontant ma pause. Cela correspond à mon voyage à vélo jusqu'en Croatie et à mon déplacement jusqu'au Japon.",
          "inLanguage": ["fr", "en", "es", "it", "de", "nl"],
          "publisher": { "@id": "https://cycling-beard.vercel.app/#remi" },
          "author": { "@id": "https://cycling-beard.vercel.app/#remi" }
        },
        {
          "@type": "Person",
          "@id": "https://cycling-beard.vercel.app/#remi",
          "name": "Rémi Gladieu",
          "givenName": "Rémi",
          "familyName": "Gladieu",
          "url": "https://cycling-beard.vercel.app/",
          "description": "Auteur du blog The Moving Beard : voyage à vélo jusqu'en Croatie, puis déplacement jusqu'au Japon."
        }
      ]
    }
    </script>

    <!-- Widget Buy Me a Coffee -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="cyclingBeard"
      data-description="Soutenez Rémi sur son voyage !"
      data-message="Merci de suivre l'aventure ! Un café pour la route ?"
      data-color="#E8620A"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="74"
    ></script>
  </head>
  <body>
    <div id="root"></div>
